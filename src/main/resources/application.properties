spring.application.name=${APP_NAME}
app.application.name=${APP_NAME}

server.servlet.context-path=/api
server.port=8080

# -----------------------------------------------------------------
# BASE DE DATOS
# -----------------------------------------------------------------
# En PROD (Docker) leerá DB_URL. En LOCAL usará localhost automáticamente.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mumanal_core?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# spring.jpa.show-sql=true
logging.level.org.springframework.security.web.*=debug

# -----------------------------------------------------------------
# SEGURIDAD Y JWT
# -----------------------------------------------------------------
# ¡OJO! Aquí NO ponemos valor por defecto para el secreto por seguridad,
# o ponemos uno "dummy" para desarrollo.
app.security.jwt.secret=${JWT_SECRET:secret_password}
app.security.jwt.expiration=${JWT_EXPIRATION:36000000}

# -----------------------------------------------------------------
# CORS (Orígenes permitidos)
# -----------------------------------------------------------------
# En Prod inyectaremos la IP de tu servidor o dominio.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.security.cors.allowed-headers=*
app.security.cors.exposed-headers=Authorization

# -----------------------------------------------------------------
# DATA SEEDER (Usuarios iniciales)
# -----------------------------------------------------------------
app.security.user.system-password=${SEEDER_SYSTEM_PASS:password}
app.security.user.wcarlo-password=${SEEDER_WCARLO_PASS:password}
app.security.user.marceloq-password=${SEEDER_MARCELOQ_PASS:password}
